function findOutcome(name){return S.outcomes.find(o=>o.name===name);}
function findSub(o,name){return o?o.subs.find(s=>s.name===name):null;}
function findGroupVal(arr,gName,vName){const g=arr.find(x=>x.name===gName);if(!g)return null;const v=g.values.find(x=>x.name===vName);return v?{g,v}:null;}
function addPersona(def){
  const o=findOutcome(def.outcome);const outs=[];let outName=def.outcome;
  if(o){if(def.sub){const su=findSub(o,def.sub);if(su){outs.push('sub:'+o.id+':'+su.id);outName=su.name;}else outs.push('out:'+o.id);}else outs.push('out:'+o.id);}

const LSKEY="exodus-seg-v6";
let S=blank();
let expanded=new Set(),selOut=new Set(),selRow=new Set(),selFac=new Set(),selDetail=null,ui={form:null,arg:null,focus:null};
function resetSel(){expanded=new Set();selOut=new Set();selRow=new Set();selFac=new Set();selDetail=null;ui={form:null,arg:null,focus:null};S.outcomes.forEach(o=>expanded.add(o.id));}
function persist(){try{localStorage.setItem(LSKEY,JSON.stringify(S));if($("saved"))$("saved").textContent="saved ✓";}catch(e){}}
function load(){try{const r=localStorage.getItem(LSKEY);if(r){S=JSON.parse(r);return true;}}catch(e){}return false;}

const product=()=>S.product.trim()||"it";
const outById=id=>S.outcomes.find(o=>o.id===id);
function outLabel(key){const[t,a,b]=key.split(":");const o=outById(a);if(!o)return"";if(t==="out")return o.name;const su=o.subs.find(x=>x.id===b);return su?su.name:o.name;}
function selByGroup(){const g={};S.facets.forEach(f=>{const s=f.values.filter(v=>selFac.has("f:"+f.id+":"+v.id)).map(v=>v.name);if(s.length)g[f.name]=s;});return g;}
function facWords(){const w=[];
  S.demos.forEach(d=>{const s=d.values.filter(v=>selRow.has("d:"+d.id+":"+v.id));if(s.length&&!(d.values.length>1&&s.length===d.values.length))w.push(...s.map(v=>v.name));});
  S.facets.forEach(f=>{const s=f.values.filter(v=>selFac.has("f:"+f.id+":"+v.id));if(s.length&&!(f.values.length>1&&s.length===f.values.length))w.push(...s.map(v=>v.name));});
  return w;}
function definingTrait(){const bg=selByGroup();for(const g of ["State","Belief","Occasion","Identity","Value"]){if(bg[g])return bg[g][0];}
  const outs=[...selOut].map(outLabel).filter(Boolean);return outs[0]||null;}
function personaName(){let t=definingTrait();
  if(!t){const anyDemo=[...selRow].length?facWords()[0]:null;if(!anyDemo){S.keyCounter++;return NAMES[(S.keyCounter-1)%NAMES.length];}t=anyDemo;}
  t=t.replace(/^(on|tried|has|no|just)\s+/i,"").replace(/\(.*?\)/g,"").trim();
  const clean=t.replace(/[^a-zA-Z0-9\s-]/g,"").trim()||"Segment";
  const letter=(clean.match(/[a-zA-Z]/)||["S"])[0].toUpperCase();
  const title=clean.split(/\s+/)[0];const cap=title.charAt(0).toUpperCase()+title.slice(1);
  return cap+" "+(NAMEBANK[letter]||"Sam");}
function selDemoByGroup(){const g={};S.demos.forEach(d=>{const s=d.values.filter(v=>selRow.has("d:"+d.id+":"+v.id)).map(v=>v.name);if(s.length)g[d.name]=s;});return g;}
function joinAnd(a){return a.length<=1?a.join(""):a.length===2?a[0]+" and "+a[1]:a.slice(0,-1).join(", ")+", and "+a[a.length-1];}
function facetClause(fam,vals){const v=joinAnd(vals);
  if(fam==="Belief")return "believe it's "+v;
  if(fam==="Identity")return "identify as "+v;
  if(fam==="Value")return "value "+v;
  if(fam==="State"){const have=vals.filter(x=>/^(tried|never|switch|diy)/i.test(x)),are=vals.filter(x=>!/^(tried|never|switch|diy)/i.test(x)),p=[];
    if(are.length)p.push("are "+joinAnd(are));if(have.length)p.push("have "+joinAnd(have));return joinAnd(p);}
  return v;}
function compose(){const demoG=selDemoByGroup(),facG=selByGroup();const outs=[...selOut].map(outLabel).filter(Boolean);
  const nO=outs.length,nF=facWords().length;
  const type=!nO&&!nF?"TAM":nO&&!nF?(nO>1?"Super segment":"Outcome segment"):!nO&&nF?"Cross segment":nO===1?"Persona":"Sub-segment";
  const subj=["Gender","Age","Buyer","Identity","Race / Ethnicity"].filter(k=>demoG[k]).map(k=>demoG[k].join("/")).join(", ");
  const clauses=[];["Belief","Identity","State","Value"].forEach(f=>{if(facG[f])clauses.push(facetClause(f,facG[f]));});
  const occ=facG["Occasion"]?facG["Occasion"].join(", "):null;
  let desc;
  if(type==="TAM")desc="Everyone — your whole TAM. Cut it down.";
  else{desc="For ";
    if(nO){desc+="the "+outs.join(" / ").toLowerCase()+" segment";if(subj)desc+=" ("+subj+")";}
    else if(subj)desc+=subj;else desc+="anyone";
    if(clauses.length)desc+=" who "+joinAnd(clauses);
    if(occ)desc+=" — triggered by "+occ;
    desc+=".";}
  return{type,desc,name:type==="TAM"?"Everyone":personaNameStable(),codeStr:[...outs.map(code),...facWords().map(code)].join("·")};}
let _nameCache=null;
function personaNameStable(){return _nameCache||(_nameCache=personaName());}

function renderFilters(){$("filters").innerHTML='<div class="fzhdr">Facets — the WHY <span>what\'s true for them right now · stack 2 families to invent a pocket</span></div>'+S.facets.map(f=>`<div class="fgroup"><span class="fglwrap"><span class="fgl">${esc(f.name)}</span><span class="fhint">${esc(FACET_SHORT[f.name]||"")}</span></span><span class="chips-inline">${f.values.map(v=>`<span class="chip ${selFac.has("f:"+f.id+":"+v.id)?"on":""}" data-act="fac" data-f="${f.id}" data-v="${v.id}">${esc(v.name)}</span>`).join("")}${ui.form==="facval"&&ui.arg===f.id?`<input id="inp" class="chip" style="border-style:solid;border-color:#bcd5fb;min-width:130px" placeholder="${esc(FACET_PH[f.name]||"new")}" onkeydown="key(event)" onblur="commit()">`:`<span class="chip addchip" data-act="addfac" data-f="${f.id}">+ add</span>`}</span></div>`).join("");}

function suggestFor(o){const have=new Set(o.subs.map(s=>s.name.toLowerCase()));
  return [...(o.bank||[]),...(LENSBANK[o.lens]||[])].filter((v,i,a)=>a.indexOf(v)===i&&!have.has(v.toLowerCase())).slice(0,6);}
function renderGrid(){const w=$("gridwrap");const demos=S.demos.filter(d=>d.values.length);
  if(!S.outcomes.length&&!demos.length){w.innerHTML=`<div class="emptyhint"><b data-act="ex" data-k="Flow">Load an example</b> to see it filled — or build from empty:<br>· ${S.outcomes.length?"":'<b data-act="addout">+ add an outcome column</b>'} then click its <b>+ sub</b><br>· add demographic rows &amp; facet pills with the <b>+ add</b> chips</div>`;return;}
  let h=`<table><tr><td class="corner">demographic ↓ / outcome →</td>`;
  S.outcomes.forEach(o=>{const os=selOut.has("out:"+o.id);h+=`<th class="ocol"><div class="ocard ${os?"on":""}" data-act="out" data-k="out:${o.id}"><span class="vert">segment</span>${esc(o.name)}${o.lens?` <span class="lens">·${esc(o.lens)}</span>`:""}<span class="x" data-act="delout" data-id="${o.id}">×</span></div><div class="subs">`;
    o.subs.forEach(su=>{const ss=selOut.has("sub:"+o.id+":"+su.id);h+=`<span class="subchip ${ss?"on":""}" data-act="out" data-k="sub:${o.id}:${su.id}">${esc(su.name)}<span class="x" data-act="delsub" data-o="${o.id}" data-s="${su.id}">×</span></span>`;});
    if(ui.form==="sub"&&ui.arg===o.id){h+=`<div class="subform"><div class="subsug">${suggestFor(o).map(s=>`<span class="s" data-act="addsubval" data-o="${o.id}" data-v="${esc(s)}">+ ${esc(s)}</span>`).join("")}</div><input id="inp" placeholder="type a sub-slice…" onkeydown="key(event)"></div>`;}
    else h+=`<div class="subadd" data-act="addsub" data-id="${o.id}">+ sub</div>`;
    h+=`</div></th>`;});
  h+=`<td class="addoc" data-act="addout">+ outcome</td></tr>`;
  demos.forEach(d=>{h+=`<tr class="grouprow"><td>${esc(d.name)}${DEMO_META[d.name]?` <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink3)">— ${esc(DEMO_META[d.name])}</span>`:""}</td>${S.outcomes.map(()=>'<td></td>').join("")}<td></td></tr>`;
    d.values.forEach(v=>{const vk="d:"+d.id+":"+v.id;const ds=selRow.has(vk);
      h+=`<tr><td class="rowh"><span class="rpill ${ds?"on":""}" data-act="row" data-k="${vk}">${esc(v.name)}<span class="x" data-act="delval" data-d="${d.id}" data-v="${v.id}">×</span></span></td>`;
      S.outcomes.forEach(o=>h+=cell(o.id,vk));h+=`<td></td></tr>`;});
    h+=`<tr><td class="rowadd">${ui.form==="demoval"&&ui.arg===d.id?`<span class="inlineform"><input id="inp" placeholder="new ${esc(d.name.toLowerCase())}" onkeydown="key(event)"><button class="btn" onclick="commit()">add</button></span>`:`<span class="addlink" data-act="adddemo" data-d="${d.id}">+ ${esc(d.name.toLowerCase())}</span>`}</td>${S.outcomes.map(()=>'<td></td>').join("")}<td></td></tr>`;});
  w.innerHTML=h+`</table>`;}
function cell(oid,vk){const os=selOut.has("out:"+oid);const ds=selRow.has(vk);const has=S.queue.find(q=>q.outs&&q.outs.includes("out:"+oid)&&q.rows&&q.rows.includes(vk));
  return `<td class="c ${os&&ds?"both":os?"osel":ds?"dsel":""}" data-act="cell" data-o="${oid}" data-v="${vk}">${os&&ds?"✓":has?'<span class="pdot"></span>':"·"}</td>`;}

function renderReadout(){const c=compose();$("badge").textContent=c.type;$("segname").textContent=c.name;$("pdesc").textContent=c.codeStr||"";$("angle").textContent=c.desc;
  $("addQ").disabled=c.type==="TAM";$("addQ").textContent=c.type==="TAM"?"pick a combination →":`+ Save "${c.name}"`;}
function addQ(){const c=compose();if(c.type==="TAM")return;
  S.queue.push({id:nid(),key:String(S.queue.length+1).padStart(3,'0'),pname:c.name,code:c.codeStr,type:c.type,desc:c.desc,
    outs:[...selOut],rows:[...selRow],facs:[...selFac],aw:{unaware:"",problem:"",solution:"",product:"",mostaware:""}});
  render();persist();}
function renderQueue(){const q=$("queue");$("qcount").textContent=S.queue.length;
  if(!S.queue.length){q.innerHTML='<div class="empty">Pick a combination, then “Save persona.”</div>';return;}
  q.innerHTML="";S.queue.forEach((it,i)=>{const d=document.createElement('div');d.className='q'+(selDetail===it.id?' sel':'');
    d.innerHTML=`<div class="top"><span class="key">#${it.key}</span><span class="nm">${esc(it.pname)}</span><span class="code">${esc(it.code)}</span></div><div class="desc">${esc(it.type)} — ${esc(it.desc)}</div>
      <div class="ops"><span data-a="edit">${selDetail===it.id?"▾ hooks":"hooks ▸"}</span><span data-a="re">rename</span><span data-a="up">↑</span><span data-a="dn">↓</span><span data-a="del">delete</span></div>
      ${selDetail===it.id?`<div class="aw">${AW.map(([k,l])=>`<div class="awr"><span class="st">${l}</span><input data-aw="${k}" value="${esc(it.aw[k]||"")}" placeholder="hook…"></div>`).join("")}</div>`:""}`;
    d.querySelector('[data-a=edit]').onclick=e=>{e.stopPropagation();selDetail=selDetail===it.id?null:it.id;renderQueue();};
    d.querySelector('[data-a=re]').onclick=e=>{e.stopPropagation();const n=prompt("Rename persona:",it.pname);if(n){it.pname=n;renderQueue();persist();}};
    d.querySelector('[data-a=up]').onclick=e=>{e.stopPropagation();if(i>0){[S.queue[i-1],S.queue[i]]=[S.queue[i],S.queue[i-1]];renderQueue();persist();}};
    d.querySelector('[data-a=dn]').onclick=e=>{e.stopPropagation();if(i<S.queue.length-1){[S.queue[i+1],S.queue[i]]=[S.queue[i],S.queue[i+1]];renderQueue();persist();}};
    d.querySelector('[data-a=del]').onclick=e=>{e.stopPropagation();S.queue.splice(i,1);render();persist();};

function renderSetup(){const g=$("setupgrid");g.innerHTML="";
  const sc=ce('div','scol');sc.innerHTML='<h4>Outcomes → sub-slices · the WHAT</h4>';
  S.outcomes.forEach(o=>{sc.insertAdjacentHTML('beforeend',`<div class="sub">${esc(o.name)}${o.lens?` <span class="metahint">${esc(o.lens)} lens</span>`:""}</div>`);const b=ce('div');
    o.subs.forEach(su=>b.appendChild(chipX(su.name,()=>{o.subs=o.subs.filter(x=>x!==su);render();persist();})));
    b.appendChild(adder("+ sub-slice",v=>{o.subs.push({id:nid(),name:v});render();persist();}));sc.appendChild(b);});
  sc.appendChild(adder("+ outcome",v=>{S.outcomes.push({id:nid(),name:v,lens:"",subs:[],bank:[]});render();persist();}));g.appendChild(sc);
  [["Demographics · the WHO",S.demos,DEMO_META],["Facets · the WHY",S.facets,FACET_META]].forEach(([title,arr,meta])=>{const col=ce('div','scol');col.innerHTML=`<h4>${title}</h4>`;
    arr.forEach(grp=>{const hint=meta[grp.name]?` <span class="metahint">— ${esc(meta[grp.name])}</span>`:"";col.insertAdjacentHTML('beforeend',`<div class="sub">${esc(grp.name)}${hint}</div>`);const b=ce('div');
      grp.values.forEach(v=>b.appendChild(chipX(v.name,()=>{grp.values=grp.values.filter(x=>x!==v);render();persist();})));
      b.appendChild(adder("+ add value",val=>{grp.values.push({id:nid(),name:val});render();persist();}));col.appendChild(b);});g.appendChild(col);});}
function ce(t,c){const e=document.createElement(t);if(c)e.className=c;return e;}
function chipX(l,onX){const e=ce('span','editchip');e.innerHTML=`${esc(l)} <span class="x">×</span>`;e.querySelector('.x').onclick=onX;return e;}
function adder(ph,onAdd){const i=ce('input','addi');i.placeholder=ph;i.onkeydown=e=>{if(e.key==='Enter'&&i.value.trim()){onAdd(i.value.trim());i.value="";}};return i;}

window.key=e=>{if(e.key==='Enter')commit();if(e.key==='Escape')cancel();};
window.commit=()=>{const v=($("inp")||{}).value;if(v&&v.trim()){const t=v.trim();
    if(ui.form==="out")S.outcomes.push({id:nid(),name:t,lens:"",subs:[],bank:[]});
    else if(ui.form==="sub"){const o=outById(ui.arg);if(o){o.subs.push({id:nid(),name:t});expanded.add(o.id);}}
    else if(ui.form==="facval"){const f=S.facets.find(x=>x.id===ui.arg);if(f)f.values.push({id:nid(),name:t});}
    else if(ui.form==="demoval"){const d=S.demos.find(x=>x.id===ui.arg);if(d)d.values.push({id:nid(),name:t});}}
  ui={form:null,arg:null,focus:null};render();persist();};
window.cancel=()=>{ui={form:null,arg:null,focus:null};render();};

$("page").addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  if(a==="ex")loadExample(t.dataset.k);
  else if(a==="reset"){if(confirm("Empty the whole map?")){S=blank();resetSel();render();persist();}}
  else if(a==="export"){const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});const x=document.createElement('a');x.href=URL.createObjectURL(b);x.download="segments-"+(S.brand||"brand")+".json";x.click();}
  else if(a==="import"){$("importfile").click();}
  else if(a==="addout"){ui={form:"out",arg:null,focus:"inp"};render();}
  else if(a==="addsub"){ui={form:"sub",arg:t.dataset.id,focus:"inp"};render();}
  else if(a==="addsubval"){const o=outById(t.dataset.o);if(o){o.subs.push({id:nid(),name:t.dataset.v});}render();persist();}
  else if(a==="addfac"){ui={form:"facval",arg:t.dataset.f,focus:"inp"};render();}
  else if(a==="adddemo"){ui={form:"demoval",arg:t.dataset.d,focus:"inp"};render();}
  else if(a==="delout"){e.stopPropagation();S.outcomes=S.outcomes.filter(o=>o.id!==t.dataset.id);render();persist();}
  else if(a==="delsub"){e.stopPropagation();const o=outById(t.dataset.o);if(o)o.subs=o.subs.filter(s=>s.id!==t.dataset.s);render();persist();}
  else if(a==="delval"){e.stopPropagation();const d=S.demos.find(x=>x.id===t.dataset.d);if(d)d.values=d.values.filter(v=>v.id!==t.dataset.v);render();persist();}
  else if(a==="out"){tog(selOut,t.dataset.k);render();}
  else if(a==="row"){tog(selRow,t.dataset.k);render();}
  else if(a==="fac"){tog(selFac,"f:"+t.dataset.f+":"+t.dataset.v);render();}
  else if(a==="cell"){tog(selOut,"out:"+t.dataset.o);tog(selRow,t.dataset.v);render();}
  else if(a==="clr"){selOut.clear();selRow.clear();selFac.clear();render();}
});
document.addEventListener("click",e=>{if(e.target.id==="addQ")addQ();});
document.addEventListener("change",e=>{if(e.target.id!=="importfile")return;const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.outcomes&&!d.demos&&!d.facets){alert("That JSON isn't a segment map.");return;}S=normalizeImport(d);resetSel();render();persist();}catch(err){alert("Couldn't read that file: "+err.message);}};
  r.readAsText(f);e.target.value="";});
$("page").addEventListener("input",e=>{if(e.target.id==="product"){S.product=e.target.value;renderReadout();persist();}if(e.target.id==="brand"){S.brand=e.target.value;$("brandPill").firstChild.textContent=e.target.value+" ";persist();}});
function tog(set,k){set.has(k)?set.delete(k):set.add(k);}

if(!load())S=blank();
resetSel();render();persist();
</script>
</body>
</html>
