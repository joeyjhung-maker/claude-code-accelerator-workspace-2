<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A7 · Locked gift grid</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1C1A17; --red:#C23B22; --paper:#FFFFFF; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--paper); }
  .card { width:1600px; height:488px; padding:44px 56px; color:var(--ink); display:flex; flex-direction:column; gap:30px; }
  .mono { font-family:'IBM Plex Mono', monospace; font-weight:600; letter-spacing:.14em; font-size:17px; }
  .top { display:flex; justify-content:space-between; padding-bottom:14px; border-bottom:3px dashed var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:24px; }
  .tile { display:flex; flex-direction:column; gap:16px; }
  .photo { position:relative; aspect-ratio:1/1; border:3px solid var(--ink); overflow:hidden; background:#F4EFE6; }
  .photo img { width:100%; height:100%; object-fit:cover; display:block; }
  .lock { position:absolute; top:12px; right:12px; width:44px; height:44px; border-radius:50%; background:var(--red); border:3px solid var(--ink); display:flex; align-items:center; justify-content:center; }
  .lock svg { width:20px; height:20px; fill:none; stroke:#FFFFFF; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
  .name { font-family:Anton, sans-serif; font-size:29px; line-height:1; }
  .note { font-size:14px; color:#5A534A; margin-top:-8px; }
  .note.red { color:var(--red); }
</style>
</head>
<body>
<div class="card">
  <div class="top mono"><span>SAME PLAY · DIFFERENT GIFT</span><span>NOT EVERYONE DRINKS</span></div>
  <div class="grid">
    <div class="tile"><div class="photo"><img src="../gifts/whisky.png" alt=""><div class="lock"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div></div><div class="name">LOCKED WHISKY</div><div class="mono note">THE ORIGINAL</div></div>
    <div class="tile"><div class="photo"><img src="../gifts/wine.png" alt=""><div class="lock"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div></div><div class="name">LOCKED RED WINE</div><div class="mono note">FOR THE WINE CROWD</div></div>
    <div class="tile"><div class="photo"><img src="../gifts/yeti.png" alt=""><div class="lock"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div></div><div class="name">LOCKED YETI TUMBLER</div><div class="mono note red">FOR NON-DRINKERS</div></div>
    <div class="tile"><div class="photo"><img src="../gifts/airtag.png" alt=""><div class="lock"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div></div><div class="name">LOCKED AIRTAG</div><div class="mono note red">FOR THE TECH CROWD</div></div>
    <div class="tile"><div class="photo"><img src="../gifts/jbl.png" alt=""><div class="lock"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div></div><div class="name">LOCKED JBL SPEAKER</div><div class="mono note red">FOR THE DESK</div></div>
  </div>
</div>
</body>
</html>
