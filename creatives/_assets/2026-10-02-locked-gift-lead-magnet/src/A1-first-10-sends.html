<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A1 · First 10 sends</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1C1A17; --red:#C23B22; --tint:#F3EBDD; --paper:#FFFFFF; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--paper); }
  .card { width:1600px; height:960px; padding:48px 56px; color:var(--ink); display:flex; flex-direction:column; gap:30px; }
  .mono { font-family:'IBM Plex Mono', monospace; font-weight:600; letter-spacing:.12em; font-size:17px; }
  .top { display:flex; justify-content:space-between; padding-bottom:14px; border-bottom:3px dashed var(--ink); }
  h2 { margin:0; font-family:Anton, sans-serif; font-weight:400; font-size:132px; line-height:.95; }
  h2 .red { color:var(--red); }
  .tiles { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:20px; }
  .tile { height:190px; border:3px solid var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  .tile svg { width:56px; height:56px; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; }
  .client { background:var(--red); color:#FFFFFF; }
  .call { background:var(--ink); color:#FFFFFF; }
  .sent { background:var(--tint); border-style:dashed; }
</style>
</head>
<body>
<div class="card">
  <div class="top mono"><span>TRACKING REPORT · OUR FIRST 10 SENDS</span><span>INDOOR ADVENTURE PARKS · UK</span></div>
  <h2>10 SENT.<br>6 CALLS BOOKED.<br><span class="red">3 CLIENTS CLOSED.</span></h2>
  <div class="tiles" id="tiles"></div>
</div>
<script>
  const icons = {
    client: '<svg viewBox="0 0 24 24" stroke-width="2.6"><path d="M20 6L9 17l-5-5"/></svg>',
    call: '<svg viewBox="0 0 24 24" stroke-width="1.9"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
    sent: '<svg viewBox="0 0 24 24" stroke-width="1.7"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4"/><path d="M12 11v10"/></svg>'
  };
  const labels = { client:'CLIENT', call:'CALL BOOKED', sent:'SENT' };
  const kinds = [...Array(10)].map((_, i) => i < 3 ? 'client' : i < 6 ? 'call' : 'sent');
  document.getElementById('tiles').innerHTML = kinds.map(k =>
    `<div class="tile ${k}">${icons[k]}<span class="mono">${labels[k]}</span></div>`).join('');
</script>
</body>
</html>
