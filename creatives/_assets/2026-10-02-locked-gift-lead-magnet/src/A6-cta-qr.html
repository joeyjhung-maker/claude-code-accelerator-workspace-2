<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A6 · Join B2B Leads Lab CTA with QR</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@600&family=Libre+Franklin:wght@800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1C1A17; --red:#C23B22; --paper:#FFFFFF; --label:#FBF8F1; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--paper); }
  .card { width:1600px; height:660px; padding:48px 70px 56px 56px; color:var(--ink); display:flex; align-items:center; gap:80px; }
  .mono { font-family:'IBM Plex Mono', monospace; font-weight:600; letter-spacing:.14em; font-size:17px; }
  .left { flex-grow:1; display:flex; flex-direction:column; gap:22px; }
  h2 { margin:0; font-family:Anton, sans-serif; font-weight:400; font-size:118px; line-height:.95; }
  h2 .red { color:var(--red); }
  .sub { font-family:'Libre Franklin', sans-serif; font-weight:800; font-size:34px; }
  .btn { align-self:flex-start; background:var(--red); color:#FFFFFF; font-family:Anton, sans-serif; font-size:48px; letter-spacing:.03em; padding:16px 36px 20px; border:4px solid var(--ink); box-shadow:8px 8px 0 var(--ink); margin-top:8px; }
  .code { margin-top:10px; }
  .code b { color:var(--red); }
  .qr { flex-shrink:0; background:var(--label); border:4px solid var(--ink); box-shadow:14px 14px 0 var(--ink); padding:30px 30px 22px; display:flex; flex-direction:column; align-items:center; gap:16px; transform:rotate(1.5deg); }
  .qr img { width:330px; height:330px; display:block; image-rendering:pixelated; background:#FFFFFF; padding:14px; }
  .qr .mono { font-size:20px; }
  .qr small { font-family:'IBM Plex Mono', monospace; font-size:14px; letter-spacing:.06em; color:#5A534A; }
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <div class="mono">YOUR NEXT STEP</div>
    <h2>JOIN B2B LEADS LAB<br><span class="red">FREE.</span></h2>
    <div class="sub">+ claim your 200 free B2B leads</div>
    <div class="btn">JOIN FREE →</div>
    <div class="mono code">COUPON CODE: <b>DANWARDROPELEADS</b> · ON TOPA.IO</div>
  </div>
  <div class="qr">
    <img src="qr-b2b-leads-lab.svg" alt="QR code to skool.com/b2b-leads-lab">
    <div class="mono">SCAN TO JOIN</div>
    <small>skool.com/b2b-leads-lab</small>
  </div>
</div>
</body>
</html>
