<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A5 · Topa coupon ticket</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@600&family=Libre+Franklin:wght@800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1C1A17; --red:#C23B22; --paper:#FFFFFF; --label:#FBF8F1; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--paper); }
  .card { width:1600px; height:780px; padding:44px 70px 40px 56px; color:var(--ink); display:flex; flex-direction:column; gap:26px; }
  .mono { font-family:'IBM Plex Mono', monospace; font-weight:600; letter-spacing:.14em; font-size:17px; }
  .top { display:flex; justify-content:space-between; }
  .ticket { position:relative; display:flex; height:560px; border:4px solid var(--ink); box-shadow:14px 14px 0 var(--ink); }
  .stub { width:460px; flex-shrink:0; background:var(--red); color:#FFFFFF; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; border-right:5px dashed #FFFFFF; }
  .stub .num { font-family:Anton, sans-serif; font-size:230px; line-height:.9; }
  .stub .what { font-family:Anton, sans-serif; font-size:46px; letter-spacing:.03em; }
  .stub .mono { font-size:15px; letter-spacing:.18em; margin-top:16px; }
  .notch { position:absolute; left:436px; width:48px; height:48px; border-radius:50%; background:var(--paper); border:4px solid var(--ink); }
  .notch.t { top:-26px; clip-path:inset(50% 0 0 0); }
  .notch.b { bottom:-26px; clip-path:inset(0 0 50% 0); }
  .main { flex-grow:1; background:var(--label); padding:48px 60px; display:flex; flex-direction:column; gap:28px; }
  .row { display:flex; align-items:center; gap:20px; font-family:'Libre Franklin', sans-serif; font-weight:800; font-size:34px; }
  .n { width:54px; height:54px; flex-shrink:0; border-radius:50%; background:var(--ink); color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-family:Anton, sans-serif; font-size:27px; }
  .code { border:4px dashed var(--ink); padding:22px; text-align:center; font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:52px; letter-spacing:.05em; }
  .bars { margin-top:auto; height:64px; background:repeating-linear-gradient(90deg, var(--ink) 0 3px, transparent 3px 6px, var(--ink) 6px 7px, transparent 7px 11px, var(--ink) 11px 16px, transparent 16px 19px); }
  .scribble { align-self:flex-end; font-family:Caveat, cursive; font-size:60px; line-height:1; transform:rotate(-4deg); margin-top:-4px; }
</style>
</head>
<body>
<div class="card">
  <div class="top mono"><span>A LITTLE PRESENT FROM DAN</span><span>VALID AT TOPA.IO</span></div>
  <div class="ticket">
    <div class="stub">
      <div class="num">200</div>
      <div class="what">FREE B2B LEADS</div>
      <div class="mono">ADMIT ONE DREAM 100</div>
    </div>
    <div class="notch t"></div>
    <div class="notch b"></div>
    <div class="main">
      <div class="mono">HOW TO CLAIM</div>
      <div class="row"><div class="n">1</div>Sign up at Topa.io</div>
      <div class="row"><div class="n">2</div>Enter this code inside the app</div>
      <div class="code">DANWARDROPELEADS</div>
      <div class="bars"></div>
    </div>
  </div>
  <div class="scribble">No excuse now :-)</div>
</div>
</body>
</html>
