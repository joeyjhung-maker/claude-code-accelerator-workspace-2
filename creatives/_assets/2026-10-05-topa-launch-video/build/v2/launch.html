<!doctype html>
<html><head><meta charset="utf-8">
<!-- Topa launch video / mini VSL. 1920x1080, frame-accurate: window.seek(t) renders any moment.
     Every animation is keyed to word times in timing.js (built by build/align.py from the VO). -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="timing.js"></script>
<style>
:root{--bg:#0a0a1a;--txt:#f7f4f0;--mut:#a09dc0;--line:rgba(255,255,255,.13);--panel:#121130;--green:#34d399;
--grad:linear-gradient(135deg,#a855f7 0%,#c084fc 15%,#d8b4fe 25%,#ff66d4 35%,#ff66a3 50%,#ff8866 65%,#ffa366 80%,#ffc966 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden}
#bg{position:absolute;inset:0;background:var(--bg)}
.blob{position:absolute;width:1500px;height:1500px;border-radius:50%;left:0;top:0}
#b1{background:radial-gradient(closest-side,rgba(140,70,240,.42),rgba(140,70,240,0))}
#b2{background:radial-gradient(closest-side,rgba(255,102,163,.26),rgba(255,102,163,0))}
#b3{background:radial-gradient(closest-side,rgba(255,163,102,.16),rgba(255,163,102,0))}
#grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.5px);background-size:48px 48px}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(10,10,26,0) 45%,rgba(10,10,26,.78) 100%)}
.scene,.view{position:absolute;inset:0;visibility:hidden;opacity:0}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.gb{background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--grad) border-box;border:3px solid transparent;box-shadow:0 0 90px rgba(190,100,255,.28),0 30px 80px rgba(0,0,0,.5)}
.card{background:rgba(22,20,52,.9);border:1.5px solid var(--line);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:10px;border:1.5px solid rgba(255,255,255,.4);border-radius:999px;padding:10px 24px;font-size:26px;font-weight:600;white-space:nowrap}
.ok{color:var(--green);border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.12)}
.sup{position:absolute;left:0;right:0;text-align:center;font-weight:300;letter-spacing:-.025em;font-size:76px;line-height:1.08}
.sup b{font-weight:800}
.abs{position:absolute}
#logo{position:absolute;left:56px;top:44px;display:flex;align-items:center;gap:14px;font-size:38px;font-weight:600;letter-spacing:-.02em}
#logo svg{width:50px;height:50px}#logo .io{opacity:.6;font-weight:400}
/* captions */
#cap{position:absolute;left:0;right:0;bottom:44px;text-align:center}
#cap .in{display:inline-block;background:rgba(8,8,22,.82);border:1.5px solid rgba(255,255,255,.1);border-radius:22px;padding:14px 34px;font-size:46px;font-weight:800;letter-spacing:-.015em;white-space:nowrap}
#cap .w{color:#fff}#cap .w.on{color:#ffb866}#cap .w.fut{color:rgba(255,255,255,.62)}
/* s1 */
#hl0{position:absolute;left:0;right:0;top:112px;text-align:center;font-size:116px;line-height:1.08;font-weight:800;letter-spacing:-.035em}
#hl0 .hw{display:inline-block;margin:0 .13em}
#comp{position:absolute;left:400px;top:690px;width:1120px;height:150px;border-radius:44px;display:flex;align-items:center;padding:0 26px 0 30px;gap:26px}
#comp .field{flex:1;font-size:56px;font-weight:600;display:flex;align-items:center;height:100%}
.ph i{display:inline-block;height:20px;border-radius:10px;background:rgba(255,255,255,.2);margin-right:22px}
.caret{display:inline-block;width:5px;height:64px;background:#ff66d4;margin-left:6px;border-radius:3px}
.send{width:98px;height:98px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;flex:none}
.bub{background:var(--grad);color:#150a2a;font-weight:800;border-radius:40px 40px 10px 40px;padding:24px 44px;font-size:56px;display:inline-block;white-space:nowrap;box-shadow:0 20px 60px rgba(255,102,163,.35)}
.bub.in{background:#23214d;color:#fff;border-radius:40px 40px 40px 10px;box-shadow:none;font-weight:600}
.node{position:absolute;transform:translate(-50%,-50%)}
.node .tag{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:8px;background:#ffc966;color:#1a1030;font-weight:800;font-size:22px;border-radius:999px;padding:5px 16px;white-space:nowrap}
.node .first{position:absolute;right:-12px;top:-10px;background:#fff;color:#1a1030;font-weight:900;font-size:19px;border-radius:999px;padding:3px 10px}
.ring{position:absolute;inset:-9px;border-radius:50%;border:4px solid #ffc966;box-shadow:0 0 34px rgba(255,201,102,.75)}
/* app window */
#app{position:absolute;left:150px;top:128px;width:1620px;height:782px;border-radius:32px;overflow:hidden;display:flex}
#side{width:300px;background:rgba(8,8,24,.75);border-right:1.5px solid var(--line);padding:30px 22px;flex:none}
#side .lg{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:600;margin-bottom:34px}#side .lg svg{width:36px;height:36px}
#side .ni{font-size:24px;color:var(--mut);padding:13px 18px;border-radius:14px;margin-bottom:6px;font-weight:500}
#main{position:relative;flex:1}
.vh{font-size:40px;font-weight:700;letter-spacing:-.02em;position:absolute;left:50px;top:36px}
.steppill{position:absolute;right:44px;top:34px;font-size:26px;font-weight:700;border-radius:999px;padding:10px 26px;background:rgba(192,132,252,.2);border:1.5px solid rgba(192,132,252,.6)}
.btn{display:inline-flex;align-items:center;gap:12px;border-radius:999px;padding:18px 36px;font-size:30px;font-weight:700;background:var(--grad);color:#170a2c;white-space:nowrap}
.row{display:flex;align-items:center;gap:22px;background:rgba(255,255,255,.045);border:1.5px solid var(--line);border-radius:22px;padding:18px 26px}
.row .nm{font-size:30px;font-weight:700}.row .sub{font-size:23px;color:var(--mut);margin-top:3px}
.opt{position:absolute;width:590px;height:540px;border-radius:30px;background:rgba(255,255,255,.045);border:2px solid var(--line);padding:46px}
.opt h4{font-size:46px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}.opt p{font-size:30px;color:var(--mut);line-height:1.35}
.glow{position:absolute;inset:-3px;border-radius:32px;border:4px solid #ff66d4;box-shadow:0 0 60px rgba(255,102,212,.55)}
.mono{font-variant-numeric:tabular-nums}
#cursor{position:absolute;width:44px;height:44px;left:0;top:0;z-index:50}
.stamp{border:8px solid #ff5d7a;color:#ff5d7a;font-weight:900;font-size:74px;letter-spacing:.02em;padding:10px 34px;border-radius:18px;white-space:nowrap;background:rgba(10,10,26,.6)}
.big{font-weight:900;letter-spacing:-.05em;line-height:.9}
.tile{width:104px;height:84px;border-radius:16px;background:rgba(255,255,255,.06);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--mut);position:relative;overflow:hidden}
.tile i{position:absolute;inset:0;background:var(--grad)}.tile span{position:relative}
.lk{display:inline-flex;align-items:center;gap:.2em;vertical-align:middle;height:1.2em}.lk i{display:inline-block;height:.6em;border-radius:.3em;background:rgba(23,10,44,.5);filter:blur(.05em)}.lk .lki{font-size:.78em;margin-right:.1em}
.dmb{position:absolute;width:58px;height:42px;margin:-21px 0 0 -29px;border-radius:16px 16px 16px 4px;background:#e9e6f5;display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:0 6px 18px rgba(0,0,0,.4)}.dmb i{width:8px;height:8px;border-radius:50%;background:#7a7696}
.tnum{width:84px;height:84px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#170a2c}.th{font-size:42px;font-weight:800;line-height:1.14;letter-spacing:-.02em;margin-top:24px}
</style></head>
<body><div id="stage">
<div id="bg"><div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div><div id="grid"></div><div id="vig"></div></div>
<div id="scenes"></div>
<div id="logo"></div>
<div id="cap"><span class="in" id="capin"></span></div>
</div>
<script>
/* ---------- helpers ---------- */
const norm = w => w.toLowerCase().replace(/[^a-z0-9]/g, '');
const Ls = TIMING.lines, DUR = TIMING.dur;
const ls = i => Ls[i].s, le = i => Ls[i].e;
const wt = (i, word, n = 0) => { const k = Ls[i].words.filter(w => norm(w.w).includes(norm(word)))[n]; if (!k) throw new Error(`word "${word}" not in line ${i}`); return k.s; };
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out', duration: .5 } });
const DYN = []; const dyn = f => DYN.push(f);
window.CUES = []; const cue = (t, name, gain = -18, o = {}) => CUES.push({ t: +t.toFixed(3), name, gain, ...o });
let gid = 0;
const mark = () => { const g = 'tg' + (gid++); return `<svg viewBox="0 0 32 32" fill="none"><defs><linearGradient id="${g}" x1="4" y1="3" x2="28" y2="29" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a855f7"/><stop offset=".25" stop-color="#d8b4fe"/><stop offset=".35" stop-color="#ff66d4"/><stop offset=".5" stop-color="#ff66a3"/><stop offset=".65" stop-color="#ff8866"/><stop offset="1" stop-color="#ffc966"/></linearGradient></defs><path d="M7.4 5.6 L5.8 2.5" stroke="url(#${g})" stroke-width="2.7" stroke-linecap="round"/><path d="M24.6 5.6 L26.2 2.5" stroke="url(#${g})" stroke-width="2.7" stroke-linecap="round"/><path fill-rule="evenodd" fill="url(#${g})" d="M8.6 4.8 H23.4 A5 5 0 0 1 28.4 9.8 V25.4 A5 5 0 0 1 23.4 30.4 H8.6 A5 5 0 0 1 3.6 25.4 V9.8 A5 5 0 0 1 8.6 4.8 Z M9.4 8 H22.6 A2.6 2.6 0 0 1 25.2 10.6 V23.6 L26.4 28 L22.4 27.2 H9.4 A2.6 2.6 0 0 1 6.8 24.6 V10.6 A2.6 2.6 0 0 1 9.4 8 Z"/><rect x="9.55" y="15.35" width="3.5" height="4.7" rx="1.75" fill="url(#${g})"/><rect x="18.95" y="15.35" width="3.5" height="4.7" rx="1.75" fill="url(#${g})"/></svg>`; };
const PAL = [['#a855f7', '#ff66d4'], ['#ff66a3', '#ffa366'], ['#38bdf8', '#818cf8'], ['#34d399', '#22d3ee'], ['#f59e0b', '#ef4444'], ['#c084fc', '#60a5fa'], ['#fb7185', '#f472b6'], ['#4ade80', '#22c55e']];
const av = (ini, k = 0, size = 72) => `<div class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .36)}px;background:linear-gradient(135deg,${PAL[k % 8][0]},${PAL[k % 8][1]})">${ini}</div>`;
const PEOPLE = [['Sarah M.', 'Founder · Marketing agency', 'SM'], ['David K.', 'CEO · HVAC group', 'DK'], ['Priya S.', 'MD · Logistics firm', 'PS'], ['Tom H.', 'Owner · Dental group', 'TH'], ['Aisha B.', 'COO · Software company', 'AB'], ['Marcus L.', 'Director · Recruitment', 'ML'], ['Elena R.', 'Founder · Law firm', 'ER'], ['James O.', 'CEO · Manufacturing', 'JO']];
const INI = ['SM', 'DK', 'PS', 'TH', 'AB', 'ML', 'ER', 'JO', 'RC', 'NW', 'LB', 'KP', 'HG', 'OF', 'VT', 'ZA', 'BD', 'CM', 'EJ', 'FY'];
const CHECK = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
const ARROW = '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#170a2c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const PHONE = (c = '#fff', s = 44) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>`;
const add = html => { const d = document.createElement('div'); d.innerHTML = html.trim(); const el = d.firstChild; $('#scenes').appendChild(el); return el; };
function show(el, s, e, first) {            // scene in/out
  if (first) gsap.set(el, { autoAlpha: 1 }); else { tl.fromTo(el, { autoAlpha: 0, scale: .955, y: 36 }, { autoAlpha: 1, scale: 1, y: 0, duration: .5 }, s - .06); cue(s - .16, 'whoosh', -21); }
  if (e < DUR - .2) tl.to(el, { autoAlpha: 0, scale: 1.045, duration: .26, ease: 'power2.in' }, e - .24);
}
function view(el, s, e, last) {             // sub-view inside a scene
  tl.fromTo(el, { autoAlpha: 0, y: 44 }, { autoAlpha: 1, y: 0, duration: .42 }, s);
  if (!last) tl.to(el, { autoAlpha: 0, y: -36, duration: .22, ease: 'power2.in' }, e - .22);
}
const pop = (sel, t, o = {}) => tl.fromTo(sel, { autoAlpha: 0, scale: o.from ?? .6, y: o.y ?? 24 }, { autoAlpha: 1, scale: 1, y: 0, duration: o.d ?? .5, ease: o.ease ?? 'back.out(1.7)', stagger: o.stagger ?? 0 }, t);
const fade = (sel, t, o = {}) => tl.fromTo(sel, { autoAlpha: 0, y: o.y ?? 18 }, { autoAlpha: 1, y: 0, duration: o.d ?? .4, stagger: o.stagger ?? 0 }, t);
function typeText(el, str, t0, d, sfx = true) { dyn(t => { el.textContent = str.slice(0, Math.round(clamp((t - t0) / d) * str.length)); }); if (sfx) cue(t0, 'typing', -25, { dur: d }); }
function count(el, a, b, t0, d, fmt = v => Math.round(v).toLocaleString('en-US')) { dyn(t => { el.textContent = fmt(a + (b - a) * eo((t - t0) / d)); }); }
function swap(el, t0, txt) { const a = el.textContent; dyn(t => { const v = t >= t0 ? txt : (el._sw && t >= el._sw[0] ? el._sw[1] : a); if (t >= t0 || !el._sw || t < el._sw[0]) el.textContent = t >= t0 ? txt : a; }); }
const ix = (sec, k = 0) => { const i = Ls.findIndex(l => l.sec === sec); if (i < 0) throw new Error('no section ' + sec); return i + k; };
const LEAD = ix('LEAD'), PROB = ix('PROBLEM'), TURN = ix('TURN'), MECH = ix('MECHANISM'), PROOF = ix('PROOF'), HOW = ix('HOW'), DB = ix('DATABASE'), OBJ = ix('OBJECTION'), PRICE = ix('PRICE'), CTA = ix('CTA');
const B = { s2: ls(LEAD + 1) - .12, s3: ls(PROB) - .14, tn: ls(TURN) - .15, s4: ls(MECH) - .5, s5: ls(PROOF) - .2, s6: ls(HOW) - .2, db: ls(DB) - .2, s7: ls(OBJ) - .2, s8: ls(PRICE) - .2, s9: ls(CTA) - .2 };
// The hand raiser wording is members-only: it is only ever drawn as a locked, blurred message.
const locked = () => `<span class="lk"><span class="lki">🔒</span><i style="width:3.1em"></i><i style="width:1.5em"></i><i style="width:2.3em"></i></span>`;

/* ---------- persistent logo ---------- */
$('#logo').innerHTML = mark() + '<span>topa<span class="io">.io</span></span>';
tl.to('#logo', { autoAlpha: 0, duration: .25 }, B.s4).to('#logo', { autoAlpha: 1, duration: .4 }, ls(MECH + 1) - .1);
tl.to('#logo', { autoAlpha: 0, duration: .25 }, ls(CTA + 1) - .25);

/* ---------- S1 lead: the big deals are on LinkedIn ---------- */
(() => {
  const deals = [['CEO', '$250k', 'DK', 4], ['Founder', '$500k', 'PS', 2], ['Managing Director', '$1m+', 'OF', 5]];
  const el = add(`<div class="scene" id="s1"><div id="s1nodes"></div><div id="hl0"></div>
   <div class="abs" style="left:240px;top:560px;width:1440px;display:flex;gap:36px">${deals.map((d, i) => `<div class="gb dealc" style="flex:1;border-radius:36px;padding:30px 34px;display:flex;align-items:center;gap:26px"><div style="position:relative">${av(d[2], d[3], 116)}<div class="ring"></div></div><div><div style="font-size:30px;font-weight:700;color:var(--mut)">${d[0]}</div><div class="big gt dealv" style="font-size:92px;margin-top:8px">${d[1]}</div><div style="font-size:26px;font-weight:600;margin-top:6px">deal</div></div></div>`).join('')}</div></div>`);
  show(el, 0, B.s2, true);
  let h = '';
  [[150, 250], [230, 470], [110, 900], [1750, 220], [1700, 470], [1800, 900], [560, 960], [1340, 960]].forEach((p, i) => { h += `<div class="node s1n" style="left:${p[0]}px;top:${p[1]}px;opacity:.5">${av(INI[i], i, 78)}</div>`; });
  $('#s1nodes').innerHTML = h;
  dyn(t => $$('.s1n').forEach((n, i) => { n.style.transform = `translate(-50%,-50%) translate(${Math.sin(t * .6 + i * 1.7) * 14}px,${Math.cos(t * .5 + i * 2.3) * 12}px)`; }));
  dyn(t => $$('.dealc').forEach((n, i) => { n.style.transform = `translateY(${Math.sin(t * 1.1 + i * 1.4) * 7}px)`; }));
  const W = Ls[LEAD].words;
  $('#hl0').innerHTML = W.map((w, i) => `${i === 5 || i === 9 ? '<br>' : ''}<span class="hw ${i >= 1 && i <= 3 ? 'gt' : ''}" data-i="${i}">${w.w}</span>`).join('');
  const hw = $$('#hl0 .hw');
  dyn(t => hw.forEach((s, i) => { const k = clamp(1 - Math.abs((t - (W[i].s + W[i].e) / 2)) / .28); const on = t >= W[i].s - .03 && t < W[i].e + .05; s.style.transform = `translateY(${on ? -7 : 0}px) scale(${1 + .06 * k})`; if (i < 1 || i > 3) s.style.color = on ? '#ffc966' : '#f7f4f0'; }));
  [wt(LEAD, '250k') + .05, (wt(LEAD, '250k') + wt(LEAD, '1m')) / 2 + .1, wt(LEAD, '1m') + .15].forEach((t, i) => { tl.fromTo($$('.dealv')[i], { scale: 1 }, { scale: 1.22, duration: .16, yoyo: true, repeat: 1, transformOrigin: 'left center' }, t); cue(t, 'plink', -20, { step: i * 2 + 1 }); });
  cue(wt(LEAD, 'LinkedIn'), 'shimmer', -25);
})();

/* ---------- S2 lead: decision makers, everyone's in their DMs, nobody closes ---------- */
(() => {
  const L1 = LEAD + 1, L2 = LEAD + 2, L3 = LEAD + 3, L4 = LEAD + 4;
  const el = add(`<div class="scene" id="s2"><div id="s2nodes"></div><div id="s2dm"></div>
   <div class="sup" id="s2a" style="top:150px">The decision makers with <b class="gt">real budgets</b></div>
   <div class="sup" id="s2b" style="top:150px"><b>Everybody knows</b> they're there.</div>
   <div class="sup" id="s2c" style="top:150px">Everybody's fighting for them <b class="gt">in the DMs.</b></div>
   <div class="sup" id="s2d" style="top:150px">And almost <b style="color:#ff8da1">nobody is closing them.</b></div>
   <div class="card abs" id="deal" style="left:730px;top:400px;width:460px;padding:34px 38px;background:#f7f4f0;color:#1a1030;border:none">
     <div style="font-size:26px;font-weight:800;letter-spacing:.12em;color:#6b6585">CONTRACT</div>
     <div style="height:14px;border-radius:7px;background:#d9d5e6;margin-top:22px"></div><div style="height:14px;border-radius:7px;background:#d9d5e6;margin-top:14px;width:82%"></div><div style="height:14px;border-radius:7px;background:#d9d5e6;margin-top:14px;width:64%"></div>
     <svg width="380" height="90" viewBox="0 0 380 90" style="margin-top:14px;display:block"><path id="sig" d="M10 62 C40 10 60 86 84 44 S118 22 132 58 S170 76 190 38 S230 30 244 60 S300 70 366 34" fill="none" stroke="#3b1d8f" stroke-width="5" stroke-linecap="round"/><line x1="6" y1="80" x2="372" y2="80" stroke="#b8b2cc" stroke-width="3"/></svg>
     <div class="stamp" id="dealst" style="position:absolute;right:-70px;top:-34px;font-size:40px;border-width:6px;padding:8px 22px;color:#12a36b;border-color:#12a36b;background:#f7f4f0">SIGNED</div></div></div>`);
  show(el, B.s2, B.s3);

/* ---------- background + captions + seek ---------- */
const CAPSKIP = new Set([LEAD, CTA + 1]); let capKey = '';
function captions(t) {
  let li = -1; for (let i = 0; i < Ls.length; i++) if (t >= Ls[i].s - .08) li = i;
  const cap = $('#cap');
  if (li < 0 || CAPSKIP.has(li) || t > Ls[li].e + .55) { cap.style.opacity = 0; return; }
  const W = Ls[li].words; let cw = 0; W.forEach((w, i) => { if (t >= w.s - .04) cw = i; });
  const pg = W[cw].p, key = li + ':' + pg;
  if (key !== capKey) { capKey = key; $('#capin').innerHTML = W.map((w, i) => w.p === pg ? `<span class="w" data-i="${i}">${w.w}</span>` : '').filter(Boolean).join(' '); }
  $$('#capin .w').forEach(s => { const i = +s.dataset.i; s.className = 'w' + (i === cw && t < W[i].e + .12 ? ' on' : i > cw ? ' fut' : ''); });
  cap.style.opacity = 1;
}
function background(t) {
  $('#b1').style.transform = `translate(${-380 + Math.sin(t * .11) * 260}px,${-520 + Math.cos(t * .09) * 160}px)`;
  $('#b2').style.transform = `translate(${880 + Math.cos(t * .08) * 300}px,${60 + Math.sin(t * .1) * 200}px)`;
  $('#b3').style.transform = `translate(${300 + Math.sin(t * .07 + 2) * 400}px,${260 + Math.cos(t * .06) * 120}px)`;
  $('#grid').style.backgroundPosition = `${-t * 6}px ${-t * 3}px`;
}
window.seek = t => { t = Math.max(0, Math.min(DUR, t)); tl.time(t, false); DYN.forEach(f => f(t)); background(t); captions(t); };
window.collectCues = () => CUES.slice().sort((a, b) => a.t - b.t);
window.ready = document.fonts.ready.then(() => seek(0));
const q = new URLSearchParams(location.search); if (q.get('t')) window.ready.then(() => seek(+q.get('t')));
