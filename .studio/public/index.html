<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Studio — A Map of the Work</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23e8d5a8'/><rect x='6' y='2' width='4' height='10' fill='%235f574c'/><circle cx='8' cy='3' r='2.4' fill='%236d4a86'/></svg>">
</head>
<body class="view-office">

<header id="masthead">
  <h1>The Studio</h1>
  <p class="sub">a living map of the flywheel &middot; Flexxable</p>
</header>

<div id="viewswitch">
  <button class="viewbtn" data-view="home">&#9750; Home</button>
  <button class="viewbtn on" data-view="office">&#9974; Studio</button>
  <button class="viewbtn" data-view="map">&#9873; Map</button>
  <button class="viewbtn" data-view="board">&#9638; Board</button>
</div>

<aside id="quest" aria-label="Quest log">
  <h2>&#10022; The Quest</h2>
  <ul id="quest-stats"></ul>
  <p id="quest-next"></p>
</aside>

<!-- the gatehouse (home: projects + machine sync) -->
<main id="home-wrap" hidden>
  <div id="home"></div>
</main>

<!-- office interior -->
<main id="office-wrap" hidden>
  <svg id="office" viewBox="0 0 1380 840" preserveAspectRatio="xMidYMid meet" aria-label="The studio office"></svg>
</main>

<!-- strategy-map coverage board -->
<main id="board-wrap" hidden>
  <div id="board"></div>
</main>

<!-- overworld map -->
<main id="map-wrap" hidden>
  <svg id="map" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" aria-label="Map of the studio">
    <defs>
      <radialGradient id="vignette" cx="50%" cy="46%" r="72%">
        <stop offset="62%" stop-color="rgba(59,42,26,0)"/>
        <stop offset="100%" stop-color="rgba(59,42,26,0.34)"/>
      </radialGradient>
    </defs>
  </svg>
</main>

<div id="legend">
  <span><i class="dot hot"></i> forging now</span>
  <span><i class="dot warm"></i> worked today</span>
  <span><i class="dot quiet"></i> resting</span>
  <span class="hint">click a room to enter</span>
</div>

<div id="overlay" hidden>
  <section id="scroll" role="dialog" aria-modal="true">
    <button id="scroll-close" title="Close (Esc)">&times;</button>
    <div id="scroll-head">
      <h2 id="scroll-title"></h2>
      <p id="scroll-sub"></p>
    </div>
    <div id="scroll-body"></div>
  </section>
</div>

<footer id="colophon">read-only window on the vault &middot; refreshes every 30s</footer>

<script src="studio-core.js"></script>
<script src="view-map.js"></script>
<script src="view-office.js"></script>
<script src="view-board.js"></script>
<script src="view-home.js"></script>
<script src="boot.js"></script>
</body>
</html>
